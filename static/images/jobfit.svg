<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">JobFit AI evidence-based evaluation workflow</title>
  <desc id="desc">A five-stage workflow from discovery to human-reviewed recommendation.</desc>
  <defs>
    <linearGradient id="jobfit-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#24123D"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .step-title { fill: #FFFFFF; font-size: 17px; font-weight: 700; }
      .step-note { fill: #C4B5FD; font-size: 12px; }
    </style>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#jobfit-bg)"/>
  <circle cx="1060" cy="40" r="140" fill="#8B5CF6" opacity=".07"/>
  <text x="54" y="58" fill="#FFFFFF" font-size="26" font-weight="750">Evidence before recommendation</text>
  <text x="54" y="86" fill="#A5B4FC" font-size="14">Discovery finds possibilities. Evaluation earns the conclusion. The human keeps the final decision.</text>

  <line x1="118" y1="182" x2="1082" y2="182" stroke="#4C1D95" stroke-width="4" stroke-linecap="round"/>

  <g>
    <rect x="52" y="132" width="170" height="100" rx="18" fill="#172554" stroke="#60A5FA"/>
    <text x="76" y="163" fill="#93C5FD" font-size="22">📡</text>
    <text x="76" y="191" class="step-title">Discovery</text>
    <text x="76" y="213" class="step-note">public job sources</text>
  </g>
  <path d="M226 182 H252" stroke="#A78BFA" stroke-width="3"/>
  <path d="M244 174 L254 182 L244 190" fill="none" stroke="#A78BFA" stroke-width="3"/>

  <g>
    <rect x="258" y="132" width="170" height="100" rx="18" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="282" y="163" fill="#A5B4FC" font-size="22">📏</text>
    <text x="282" y="191" class="step-title">Evaluation</text>
    <text x="282" y="213" class="step-note">evidence-based rubric</text>
  </g>
  <path d="M432 182 H458" stroke="#A78BFA" stroke-width="3"/>
  <path d="M450 174 L460 182 L450 190" fill="none" stroke="#A78BFA" stroke-width="3"/>

  <g>
    <rect x="464" y="132" width="170" height="100" rx="18" fill="#2E1065" stroke="#A78BFA"/>
    <text x="488" y="163" fill="#C4B5FD" font-size="22">⚠</text>
    <text x="488" y="191" class="step-title">Gap Detection</text>
    <text x="488" y="213" class="step-note">missing proof stays visible</text>
  </g>
  <path d="M638 182 H664" stroke="#A78BFA" stroke-width="3"/>
  <path d="M656 174 L666 182 L656 190" fill="none" stroke="#A78BFA" stroke-width="3"/>

  <g>
    <rect x="670" y="132" width="170" height="100" rx="18" fill="#3B0764" stroke="#C084FC"/>
    <text x="694" y="163" fill="#D8B4FE" font-size="22">⚙</text>
    <text x="694" y="191" class="step-title">Calibration</text>
    <text x="694" y="213" class="step-note">rules improve over time</text>
  </g>
  <path d="M844 182 H870" stroke="#A78BFA" stroke-width="3"/>
  <path d="M862 174 L872 182 L862 190" fill="none" stroke="#A78BFA" stroke-width="3"/>

  <g>
    <rect x="876" y="132" width="270" height="100" rx="18" fill="#4C1D95" stroke="#E9D5FF"/>
    <text x="900" y="163" fill="#F3E8FF" font-size="22">🚦</text>
    <text x="900" y="191" class="step-title">Recommendation</text>
    <text x="900" y="213" class="step-note">decision support, not auto-apply</text>
  </g>

  <rect x="370" y="277" width="460" height="42" rx="21" fill="#0F172A" stroke="#7C3AED"/>
  <text x="600" y="304" text-anchor="middle" fill="#E9D5FF" font-size="15" font-weight="650">👤 Human review remains the final control</text>
</svg>

