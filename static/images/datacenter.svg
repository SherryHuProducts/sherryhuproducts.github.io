    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #FFFFFF; font-size: 17px; font-weight: 700; }
      .note { fill: #94A3B8; font-size: 12px; }
