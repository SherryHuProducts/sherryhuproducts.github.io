baseURL: "https://sherryhuproducts.github.io/"
languageCode: en-us
title: Sherry Hu
copyright: "Xinlei (Sherry) Hu"
theme: PaperMod
relativeURLs: true
enableRobotsTXT: true
pagination:
  pagerSize: 12
params:
  env: production
  author: Xinlei (Sherry) Hu
  description: "Finance, systems, and applied AI. Projects, experience, and learning notes from Sherry Hu in the San Francisco Bay Area."
  defaultTheme: light
  ShowReadingTime: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: false
  hideFooter: false
  mainSections: [notes]
  assets:
    favicon: /images/favicon.svg
  label:
    text: "Sherry Hu"
menu:
  main:
    - {name: Projects, url: /projects/, weight: 10}
    - {name: Background, url: /about/, weight: 20}
    - {name: Notes, url: /notes/, weight: 30}
    - {name: Now, url: /now/, weight: 40}
    - {name: Search, url: /search/, weight: 50}
outputs:
  home: [HTML, RSS, JSON]
markup:
  goldmark:
    renderer:
      unsafe: true
