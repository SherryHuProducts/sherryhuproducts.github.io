<script>
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{
const filter=button.dataset.filter;let count=0;
document.querySelectorAll('[data-category]').forEach(card=>{const show=filter==='All'||card.dataset.category===filter;card.hidden=!show;if(show)count++;});
document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('selected',b===button);b.setAttribute('aria-pressed',String(b===button));});
const result=document.querySelector('.result-count');if(result)result.textContent=count+' project'+(count===1?'':'s');
}));
</script>
