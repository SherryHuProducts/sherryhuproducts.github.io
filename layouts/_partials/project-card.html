<article class="project-card" data-category="{{ .Params.category }}"><a class="project-cover" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true"><img src="{{ .Params.cardimage | relURL }}" alt="" width="1000" height="470" loading="lazy"></a><div class="project-card-body"><div class="card-kicker"><span>{{ .Params.category }}</span><small>{{ .Params.status }}</small></div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><div class="tag-row">{{ range .Params.tags }}<span>{{ . }}</span>{{ end }}</div><div class="card-actions"><a href="{{ .RelPermalink }}">Explore project →</a><a href="{{ .Params.repo }}" target="_blank" rel="noopener noreferrer">Code ↗</a></div></div></article>
